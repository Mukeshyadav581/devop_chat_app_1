apiVersion: apps/v1
kind: Deployment

metadata:
  name: chat-mongodb
  namespace: chat-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: chat-mongodb

  template:
    metadata:
      labels:
        app: chat-mongodb

    spec:
      containers:
        - name: chat-mongodb

          image: mongo:8.0

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 27017
              protocol: TCP

          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: "root"

            - name: MONGO_INITDB_ROOT_PASSWORD
              value: "root"

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          volumeMounts:
            - name: mongodb-storage
              mountPath: /data/db

          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"

            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"

            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        - name: mongodb-storage
          persistentVolumeClaim:
            claimName: mongodb-pvc